[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-unlocker-server"
version = "1.0.0"
description = "Universal Self-Hosted Antigravity & agy-cli Zero-Privilege Unlocker Server for Any VPS"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Agy-Imperium", email = "dev@agy-imperium.org"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Internet :: Proxy Servers",
]

[project.scripts]
agy-ui = "antigravity_unlocker.client.ui.app:main"
antigravity-unlocker = "antigravity_unlocker.server.daemon:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
